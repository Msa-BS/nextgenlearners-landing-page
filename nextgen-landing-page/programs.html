<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Current Openings | NextGenLearners</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Existing Week 2 stylesheet -->
<link rel="stylesheet" href="style.css">

<style>
    .programs-page {
        background: #f8fbff;
        min-height: 100vh;
    }

    .programs-header {
        background: linear-gradient(135deg, #15553d, #2D6A4F, #8bd1b1);
        color: white;
        padding: 80px 20px;
        text-align: center;
    }

    .programs-header h1 {
        font-size: 48px;
        font-weight: 800;
        margin-bottom: 15px;
    }

    .programs-header p {
        max-width: 700px;
        margin: auto;
        font-size: 17px;
        line-height: 1.7;
    }

    .search-section {
        max-width: 800px;
        margin: -30px auto 50px;
        position: relative;
    }

    .search-section input {
        padding: 18px 22px;
        border-radius: 50px;
        border: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        font-size: 16px;
    }

    .program-card {
        height: 100%;
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(45, 106, 79, 0.12);
        transition: 0.3s ease;
        overflow: hidden;
    }

    .program-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 18px 40px rgba(45, 106, 79, 0.18);
    }

    .program-card .card-body {
        padding: 30px;
    }

    .program-card h3 {
        color: #14532D;
        font-size: 24px;
        font-weight: 700;
    }

    .program-description {
        color: #64748B;
        line-height: 1.7;
        min-height: 85px;
    }

    .duration {
        color: #2D6A4F;
        font-weight: 600;
    }

    .skill-badge {
        background: #DDF3E8;
        color: #14532D;
        font-weight: 500;
        margin: 3px;
    }

    .apply-program-btn {
        background: #D4A017;
        color: white;
        border: none;
        border-radius: 30px;
        padding: 10px 22px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s ease;
    }

    .apply-program-btn:hover {
        background: #B8860B;
        color: white;
        transform: translateY(-2px);
    }

    #noResults {
        display: none;
        text-align: center;
        padding: 50px;
        color: #64748B;
    }

    @media (max-width: 768px) {
        .programs-header h1 {
            font-size: 36px;
        }

        .programs-header {
            padding: 60px 20px;
        }
    }
</style>

</head>

<body>

<div class="programs-page">

    <!-- PAGE HEADER -->
    <section class="programs-header">
        <h1>Current Openings</h1>

        <p>
            Explore our available internship programs and find the
            opportunity that matches your skills and interests.
        </p>
    </section>


    <!-- SEARCH + PROGRAMS -->
    <main class="container">

        <!-- Search -->
        <div class="search-section">
            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="🔍 Search by domain or skill..."
                aria-label="Search programs">
        </div>


        <!-- Dynamic Program Cards -->
        <div
            id="programsContainer"
            class="row g-4 pb-5">
        </div>


        <!-- No Results Message -->
        <div id="noResults">

            <i class="fa-solid fa-magnifying-glass fa-2x mb-3"></i>

            <h3>No programs found</h3>

            <p>
                Try searching for a different domain or skill.
            </p>

        </div>

    </main>

</div>


<!-- Week 3 JavaScript -->
<script src="script-programs.js"></script>

</body>

</html>
